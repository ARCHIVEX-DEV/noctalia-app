<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctalia 🌙</title>

    <link rel="stylesheet" href="style.css">

    <!-- API officielle Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <header>
        <div class="logo">🌙 NOCTALIA</div>
        <p>Choisis la personne avec qui discuter.</p>
    </header>

    <main>
        <div class="characters">

            <button class="character-card" onclick="chooseCharacter('Luna')">
                <div class="avatar">🌙</div>
                <div class="info">
                    <h2>Luna</h2>
                    <span>18 ans</span>
                    <p>Douce • Romantique • Affectueuse</p>
                </div>
            </button>

            <button class="character-card" onclick="chooseCharacter('Yuki')">
                <div class="avatar">🖤</div>
                <div class="info">
                    <h2>Yuki</h2>
                    <span>19 ans</span>
                    <p>Mystérieuse • Calme • Sincère</p>
                </div>
            </button>

            <button class="character-card" onclick="chooseCharacter('Maya')">
                <div class="avatar">💜</div>
                <div class="info">
                    <h2>Maya</h2>
                    <span>20 ans</span>
                    <p>Drôle • Énergique • Joueuse</p>
                </div>
            </button>

            <button class="character-card" onclick="chooseCharacter('Scarlett')">
                <div class="avatar">🌹</div>
                <div class="info">
                    <h2>Scarlett</h2>
                    <span>21 ans</span>
                    <p>Élégante • Confiante • Charmeuse</p>
                </div>
            </button>

            <button class="character-card" onclick="chooseCharacter('Ruby')">
                <div class="avatar">🔥</div>
                <div class="info">
                    <h2>Ruby</h2>
                    <span>22 ans</span>
                    <p>Audacieuse • Passionnée • Directe</p>
                </div>
            </button>

        </div>
    </main>

    <footer>
        🌙 NOCTALIA — TON UNIVERS, TES HISTOIRES
    </footer>


    <!-- SCRIPT DIRECTEMENT DANS LA PAGE POUR LE TEST -->
    <script>
        function chooseCharacter(name) {
            alert("✅ Le bouton fonctionne ! Tu as choisi " + name);
        }
    </script>

</body>
</html>
